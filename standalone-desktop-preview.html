    // Cursor tracking matching the video
    let cx = -100, cy = -100, tx = -100, ty = -100, cSize = 10;
    window.addEventListener('mousemove', (e) => {
      tx = e.clientX;
      ty = e.clientY;
      const cur = document.getElementById('custom-cursor');
      const lbl = document.getElementById('custom-cursor-label');
      if (!cur || !lbl) return;

      const customEl = e.target.closest('[data-cursor]');
      const interactive = e.target.closest('a, button');

      if (customEl) {
        const mode = customEl.getAttribute('data-cursor');
        cur.style.backgroundColor = '#e50914';
        cur.style.boxShadow = '0 0 28px rgba(229,9,20,0.75)';
        if (mode === 'view') {
          cSize = 58;
          lbl.textContent = 'VIEW';
          lbl.style.fontSize = '10px';
        } else if (mode === 'close') {
          cSize = 44;
          lbl.textContent = '✕';
          lbl.style.fontSize = '12px';
        } else {
          cSize = 46;
          lbl.textContent = '▶';
          lbl.style.fontSize = '12px';
        }
      } else if (interactive) {
        cSize = 46;
        cur.style.backgroundColor = '#e50914';
        cur.style.boxShadow = '0 0 28px rgba(229,9,20,0.75)';
        lbl.textContent = '▶';
        lbl.style.fontSize = '12px';
      } else {
        cSize = 10;
        cur.style.backgroundColor = '#ffffff';
        cur.style.boxShadow = '0 0 10px rgba(255,255,255,0.8)';
        lbl.textContent = '';
      }
      cur.style.width = cSize + 'px';
      cur.style.height = cSize + 'px';
    });

    function loopCursor() {
      cx += (tx - cx) * 0.32;
      cy += (ty - cy) * 0.32;
      const cur = document.getElementById('custom-cursor');
      if (cur) {
        cur.style.left = (cx - cSize / 2) + 'px';
        cur.style.top = (cy - cSize / 2) + 'px';
      }
      requestAnimationFrame(loopCursor);
    }
    requestAnimationFrame(loopCursor);

                <a href="./public/assets/Mahi_Resume.pdf" target="_blank" data-cursor="view" class="bg-white text-black font-semibold text-xs uppercase tracking-wider px-6 py-3.5 rounded-lg">▶ View Resume PDF</a>
                <a href="./public/assets/Mahi_Resume.pdf" download="Mahi_Resume.pdf" data-cursor="play" class="bg-zinc-900 text-white border border-white/15 font-semibold text-xs uppercase tracking-wider px-6 py-3.5 rounded-lg">⬇ Download PDF</a>
              </div>
            </div>
          </section>
        </main>

        <!-- TO BE CONTINUED FOOTER -->
        <footer id="cta" class="relative border-t border-white/10 bg-[#07070a] py-24 px-4 text-center overflow-hidden">
          <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(155,12,20,0.28)_0%,transparent_68%)] pointer-events-none"></div>
          <div class="max-w-4xl mx-auto relative z-10 space-y-6">
            <div class="text-[11px] uppercase tracking-[0.45em] text-[#e50914] font-semibold">THE NEXT EPISODE</div>
            <h2 class="font-display text-6xl sm:text-9xl tracking-wider text-white leading-none font-bold">TO BE CONTINUED...</h2>
            <div>
              <div class="text-sm uppercase tracking-[0.35em] text-white font-semibold">MAHI</div>
              <div class="text-xs uppercase tracking-[0.3em] text-zinc-400 mt-1">SOFTWARE ENGINEER • MCA @ NIT RAIPUR</div>
            </div>
            <div class="flex flex-wrap justify-center gap-3.5 pt-4">
              <a href="mailto:mahigautam7991@gmail.com" data-cursor="play" class="bg-[#e50914] text-white font-semibold text-xs uppercase tracking-[0.2em] px-7 py-3.5 rounded-full">▶ LET'S BUILD</a>
              <a href="https://www.linkedin.com/in/mahi-gautam-7b6508252/" target="_blank" data-cursor="play" class="bg-zinc-900 text-white border border-white/15 font-semibold text-xs uppercase tracking-[0.2em] px-6 py-3.5 rounded-full">LINKEDIN ↗</a>
              <a href="https://github.com/mahigautam14" target="_blank" data-cursor="play" class="bg-zinc-900 text-white border border-white/15 font-semibold text-xs uppercase tracking-[0.2em] px-6 py-3.5 rounded-full">GITHUB ↗</a>
              <a href="mailto:mahigautam7991@gmail.com" data-cursor="play" class="bg-zinc-900 text-white border border-white/15 font-semibold text-xs uppercase tracking-[0.2em] px-6 py-3.5 rounded-full">EMAIL ↗</a>
            </div>
          </div>
        </footer>

        ${state.reelOpen ? `
          <div class="fixed inset-0 z-50 bg-[#07070a] text-white flex flex-col justify-between overflow-hidden select-none">
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
              <img src="${PORTRAIT_URI}" class="w-[500px] max-w-[85vw] aspect-square object-cover opacity-25 rounded-full" />
              <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(140,12,20,0.28)_0%,#07070a_75%)]"></div>
            </div>
            <div class="relative z-20 max-w-6xl w-full mx-auto pt-6 px-6 grid grid-cols-6 gap-2.5">
              ${introSlides.map((_, i) => `
                <button onclick="setSlide(${i})" class="h-1 bg-white/20 rounded-full overflow-hidden">
                  <div class="h-full bg-white" style="width:${i <= state.reelIdx ? '100%' : '0%'}"></div>
                </button>
              `).join('')}
            </div>
            <div onclick="nextSlide()" data-cursor="play" class="relative z-20 max-w-4xl w-full mx-auto my-auto px-6 text-center space-y-4">
              <div class="text-xs uppercase tracking-[0.45em] text-[#e50914] font-semibold">${slide.epLabel}</div>
              <h2 class="font-display text-6xl sm:text-8xl tracking-wider text-white leading-none font-bold">${slide.title}</h2>
              <p class="text-sm sm:text-base text-zinc-200">${slide.line1}</p>
              <p class="text-xs sm:text-sm text-zinc-400">${slide.line2}</p>
            </div>
            <div class="relative z-20 max-w-6xl w-full mx-auto pb-7 px-6 flex items-center justify-between">
              <div class="flex items-center gap-4">
                <button onclick="togglePause()" class="w-10 h-10 rounded-full bg-white/10 border border-white/20 flex items-center justify-center text-xs">${state.reelPaused ? '▶' : '❚❚'}</button>
                <span class="text-[11px] uppercase tracking-[0.25em] text-zinc-400">SPACE • ← → • ESC</span>
              </div>
              <button onclick="closeReel()" data-cursor="close" class="bg-white text-black font-semibold text-xs uppercase tracking-[0.2em] px-6 py-3 rounded-full">BACK TO BROWSE</button>
            </div>
          </div>
        ` : ''}

        ${activeProj ? `
          <div onclick="closeProject()" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 sm:p-6 overflow-y-auto">
            <div onclick="event.stopPropagation()" class="max-w-4xl w-full bg-[#0b0b10] border border-white/15 rounded-2xl overflow-hidden shadow-2xl my-auto">
              <div class="p-8 bg-gradient-to-br ${activeProj.gradient} relative border-b border-white/10">
                <button onclick="closeProject()" data-cursor="close" class="absolute top-5 right-5 w-10 h-10 rounded-full bg-black/60 hover:bg-[#e50914] text-white flex items-center justify-center">✕</button>
                <div class="text-xs uppercase tracking-[0.3em] text-zinc-300 font-semibold mb-2">M ORIGINAL • ${activeProj.year}</div>
                <h2 class="font-display text-5xl sm:text-6xl text-white">${activeProj.title}</h2>
                <p class="text-sm text-zinc-200 mt-3">${activeProj.description}</p>
              </div>
              <div class="p-8 space-y-6">
                <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
                  ${activeProj.metrics.map(m => `
                    <div class="bg-zinc-900/70 border border-white/10 rounded-xl p-3.5">
                      <div class="font-display text-2xl text-white">${m.value}</div>
                      <div class="text-[11px] text-zinc-400">${m.label}</div>
                    </div>
                  `).join('')}
                </div>
                <ul class="space-y-2 text-xs sm:text-sm text-zinc-200">
                  ${activeProj.bullets.map(b => `<li class="flex gap-2"><span class="text-[#e50914]">•</span><span>${b}</span></li>`).join('')}
                </ul>
              </div>
            </div>
          </div>
        ` : ''}
      `;
    }

    window.goProfiles = function() { state.stage = 'profiles'; render(); };
    window.goHome = function() { state.stage = 'home'; render(); };
    window.openReel = function() { state.reelOpen = true; state.reelIdx = 0; state.reelPaused = false; startReel(); render(); };
    window.closeReel = function() { state.reelOpen = false; if (reelTimer) clearInterval(reelTimer); render(); };
    window.togglePause = function() { state.reelPaused = !state.reelPaused; render(); };
    window.setSlide = function(i) { state.reelIdx = i; render(); };
    window.nextSlide = function() { state.reelIdx = (state.reelIdx + 1) % introSlides.length; render(); };
    window.openProject = function(id) { state.activeProjectId = id; render(); };
    window.closeProject = function() { state.activeProjectId = null; render(); };

    render();
  </script>
</body>
</html>
